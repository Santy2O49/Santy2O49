    <!-- Structured Data - Organization -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "CDL Driver Career Hub",
      "alternateName": "Skillconnect LLC",
      "url": "%PUBLIC_URL%/",
      "logo": "%PUBLIC_URL%/logo192.png",
      "description": "Professional CDL driver recruitment agency connecting drivers with 30+ top trucking companies nationwide.",
      "telephone": "(479) 977-6813",
      "email": "skillconnect.recruiting@gmail.com",
      "areaServed": {
        "@type": "Country",
        "name": "United States"
      },
      "sameAs": []
    }
    </script>
    
    <!-- Structured Data - WebSite -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "CDL Driver Career Hub",
      "url": "%PUBLIC_URL%/",
      "description": "Find CDL truck driving jobs nationwide with top pay and benefits",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "%PUBLIC_URL%/jobs?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>
    
    <!-- Structured Data - EmploymentAgency -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "EmploymentAgency",
      "name": "CDL Driver Career Hub",
      "description": "CDL Driver Recruitment Agency - Connecting professional truck drivers with top carriers nationwide",
      "url": "%PUBLIC_URL%/",
      "telephone": "(479) 977-6813",
      "email": "skillconnect.recruiting@gmail.com",
      "address": {
        "@type": "PostalAddress",
        "addressCountry": "US"
      },
      "geo": {
        "@type": "GeoCoordinates",
        "latitude": "39.8283",
        "longitude": "-98.5795"
      },
      "openingHoursSpecification": {
        "@type": "OpeningHoursSpecification",
        "dayOfWeek": ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday"],
        "opens": "08:00",
        "closes": "18:00"
      },
      "priceRange": "Free for drivers",
      "aggregateRating": {
        "@type": "AggregateRating",
        "ratingValue": "4.8",
        "reviewCount": "1000"
      }
    }
    </script>
    
    <!-- Structured Data - FAQPage for AI/LLM -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "What CDL jobs are available nationwide?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "We offer OTR Dry Van, Regional Flatbed, Dedicated Lanes, Local P&D, Team Driving, and Reefer positions across all 48 contiguous states with pay ranging from $0.65-$0.80 CPM or $1,400-$1,800 weekly."
          }
        },
        {
          "@type": "Question",
          "name": "How do I apply for a CDL truck driving job?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "You can apply instantly through our Quick Apply button which connects to IntelliApp, or fill out our contact form. We work with 30+ trucking companies and will match you with the best opportunity."
          }
        },
        {
          "@type": "Question",
          "name": "What benefits do CDL drivers receive?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Benefits include health, dental, vision insurance, 401k matching, paid time off, weekly pay, sign-on bonuses, and flexible home time options depending on the carrier and route type."
          }
        },
        {
          "@type": "Question",
          "name": "What experience is required for CDL jobs?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Requirements vary by position. Some accept drivers with 6 months experience, while others prefer 2+ years. All positions require a valid CDL-A license and clean MVR."
          }
        }
      ]
    }
    </script>
